  <rect x="7"  y="21" width="14" height="1"  fill="#2A1A3E"/>
  <!-- Folder icon highlight -->
  <rect x="5"  y="13" width="22" height="1"  fill="#2A1A3E"/>
  <rect x="5"  y="13" width="1"  height="12" fill="#2A1A3E"/>
</svg>
