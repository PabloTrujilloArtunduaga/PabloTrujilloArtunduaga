  <rect x="3"  y="8"  width="10" height="1"  fill="#BE91FF"/>
  <rect x="3"  y="8"  width="1"  height="3"  fill="#BE91FF"/>
  <rect x="12" y="8"  width="1"  height="3"  fill="#9B64F6"/>
  <!-- Body -->
  <rect x="3"  y="11" width="26" height="16" fill="#17101F"/>
  <rect x="3"  y="11" width="26" height="1"  fill="#9B64F6"/>
  <rect x="3"  y="11" width="1"  height="16" fill="#9B64F6"/>
  <rect x="28" y="11" width="1"  height="16" fill="#6940A7"/>
  <rect x="3"  y="26" width="26" height="1"  fill="#6940A7"/>
