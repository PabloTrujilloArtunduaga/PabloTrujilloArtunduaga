<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" shape-rendering="crispEdges">
  <!-- WME-inspired document / text file icon (window variant, smaller border) -->
  <!-- Page body -->
  <rect x="5"  y="2"  width="18" height="22" fill="#1A1028"/>
  <rect x="5"  y="2"  width="18" height="1"  fill="#BE91FF"/>
  <rect x="5"  y="2"  width="1"  height="22" fill="#BE91FF"/>
  <rect x="22" y="2"  width="1"  height="19" fill="#9B64F6"/>
  <rect x="5"  y="23" width="18" height="1"  fill="#6940A7"/>
  <!-- Dog-ear top-right -->
  <rect x="17" y="2"  width="6"  height="1"  fill="#08050D"/>
  <rect x="22" y="2"  width="1"  height="6"  fill="#08050D"/>
  <rect x="17" y="2"  width="1"  height="6"  fill="#9B64F6"/>
  <rect x="17" y="7"  width="6"  height="1"  fill="#9B64F6"/>
  <rect x="18" y="3"  width="4"  height="4"  fill="#2A1A3E"/>
  <!-- Text lines -->
  <rect x="8"  y="10" width="11" height="1"  fill="#BE91FF"/>
  <rect x="8"  y="13" width="11" height="1"  fill="#6940A7"/>
  <rect x="8"  y="16" width="8"  height="1"  fill="#6940A7"/>
  <rect x="8"  y="19" width="10" height="1"  fill="#6940A7"/>
  <!-- Lines thickness simulating pixel text -->
  <rect x="8"  y="10" width="11" height="2"  fill="none"/>
</svg>
