<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="16" height="16" shape-rendering="crispEdges">
  <!-- WME-style maximize button: square outline -->
  <rect x="1" y="1" width="14" height="14" fill="#2A1A3E"/>
  <rect x="1" y="1" width="14" height="1"  fill="#6940A7"/>
  <rect x="1" y="1" width="1"  height="14" fill="#6940A7"/>
  <rect x="14" y="1" width="1"  height="14" fill="#4A2A6E"/>
  <rect x="1" y="14" width="14" height="1"  fill="#4A2A6E"/>
  <!-- Square outline -->
  <rect x="3" y="4" width="10" height="8"  fill="none"/>
  <rect x="3" y="4" width="10" height="2"  fill="#E8DDF7"/>
  <rect x="3" y="6" width="1"  height="6"  fill="#BE91FF"/>
  <rect x="12" y="6" width="1"  height="6"  fill="#BE91FF"/>
  <rect x="3" y="11" width="10" height="1"  fill="#BE91FF"/>
</svg>
