<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" shape-rendering="crispEdges">
  <!-- WME-inspired friends / contacts icon: two pixel figures -->
  <!-- Figure 1 (left) -->
  <!-- Head -->
  <rect x="5"  y="4"  width="8"  height="8"  fill="#1A1028"/>
  <rect x="5"  y="4"  width="8"  height="1"  fill="#BE91FF"/>
  <rect x="5"  y="4"  width="1"  height="8"  fill="#BE91FF"/>
  <rect x="12" y="4"  width="1"  height="8"  fill="#BE91FF"/>
  <rect x="5"  y="11" width="8"  height="1"  fill="#BE91FF"/>
  <rect x="7"  y="6"  width="2"  height="2"  fill="#BE91FF"/>
  <rect x="10" y="6"  width="2"  height="2"  fill="#BE91FF"/>
  <rect x="7"  y="9"  width="6"  height="1"  fill="#9B64F6"/>
  <!-- Body 1 -->
  <rect x="6"  y="13" width="6"  height="6"  fill="#8751D8"/>
  <rect x="5"  y="12" width="8"  height="1"  fill="#9B64F6"/>
  <!-- Arms 1 -->
  <rect x="3"  y="13" width="2"  height="4"  fill="#6940A7"/>
  <rect x="13" y="13" width="2"  height="4"  fill="#6940A7"/>
  <!-- Legs 1 -->
  <rect x="6"  y="20" width="2"  height="5"  fill="#6940A7"/>
  <rect x="10" y="20" width="2"  height="5"  fill="#6940A7"/>

  <!-- Figure 2 (right) -->
  <!-- Head -->
  <rect x="19" y="4"  width="8"  height="8"  fill="#1A1028"/>
  <rect x="19" y="4"  width="8"  height="1"  fill="#E8DDF7"/>
  <rect x="19" y="4"  width="1"  height="8"  fill="#E8DDF7"/>
  <rect x="26" y="4"  width="1"  height="8"  fill="#E8DDF7"/>
  <rect x="19" y="11" width="8"  height="1"  fill="#E8DDF7"/>
  <rect x="21" y="6"  width="2"  height="2"  fill="#E8DDF7"/>
  <rect x="24" y="6"  width="2"  height="2"  fill="#E8DDF7"/>
  <rect x="21" y="9"  width="6"  height="1"  fill="#BE91FF"/>
  <!-- Body 2 -->
  <rect x="20" y="13" width="6"  height="6"  fill="#6940A7"/>
  <rect x="19" y="12" width="8"  height="1"  fill="#BE91FF"/>
  <!-- Arms 2 -->
  <rect x="17" y="13" width="2"  height="4"  fill="#8751D8"/>
  <rect x="27" y="13" width="2"  height="4"  fill="#8751D8"/>
  <!-- Legs 2 -->
  <rect x="20" y="20" width="2"  height="5"  fill="#8751D8"/>
  <rect x="24" y="20" width="2"  height="5"  fill="#8751D8"/>

  <!-- Connection line -->
  <rect x="14" y="8"  width="5"  height="1"  fill="#9B64F6"/>
  <rect x="16" y="7"  width="1"  height="3"  fill="#BE91FF"/>
</svg>
