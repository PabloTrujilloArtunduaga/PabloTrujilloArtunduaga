  <rect x="5"  y="21" width="6"  height="1"  fill="#6940A7"/>
  <rect x="5"  y="23" width="8"  height="1"  fill="#6940A7"/>
  <rect x="5"  y="25" width="5"  height="1"  fill="#6940A7"/>
  <rect x="11" y="19" width="1"  height="4"  fill="#8751D8"/>
  <rect x="11" y="23" width="1"  height="3"  fill="#9B64F6"/>
  <!-- Bottom-right photo: star -->
  <rect x="17" y="17" width="12" height="12" fill="#0B0712"/>
  <rect x="23" y="19" width="2"  height="2"  fill="#BE91FF"/>
  <rect x="21" y="21" width="6"  height="2"  fill="#8751D8"/>
  <rect x="20" y="22" width="1"  height="1"  fill="#BE91FF"/>
