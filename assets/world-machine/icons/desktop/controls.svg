<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" shape-rendering="crispEdges">
  <!-- WME-inspired controls / gamepad icon -->
  <!-- Controller body -->
  <rect x="4"  y="10" width="24" height="12" fill="#1A1028"/>
  <rect x="4"  y="10" width="24" height="1"  fill="#9B64F6"/>
  <rect x="4"  y="10" width="1"  height="12" fill="#9B64F6"/>
  <rect x="27" y="10" width="1"  height="12" fill="#9B64F6"/>
  <rect x="4"  y="21" width="24" height="1"  fill="#9B64F6"/>
  <!-- Left grip -->
  <rect x="3"  y="11" width="4"  height="12" fill="#17101F"/>
  <rect x="3"  y="11" width="1"  height="12" fill="#6940A7"/>
  <rect x="3"  y="22" width="4"  height="1"  fill="#6940A7"/>
  <!-- Right grip -->
  <rect x="25" y="11" width="4"  height="12" fill="#17101F"/>
  <rect x="28" y="11" width="1"  height="12" fill="#6940A7"/>
  <rect x="25" y="22" width="4"  height="1"  fill="#6940A7"/>
  <!-- D-pad left side -->
  <rect x="7"  y="14" width="3"  height="1"  fill="#BE91FF"/>
  <rect x="8"  y="13" width="1"  height="3"  fill="#BE91FF"/>
  <!-- ABXY buttons right side -->
  <rect x="21" y="13" width="2"  height="2"  fill="#8751D8"/>
  <rect x="23" y="15" width="2"  height="2"  fill="#6940A7"/>
  <rect x="19" y="15" width="2"  height="2"  fill="#6940A7"/>
  <rect x="21" y="17" width="2"  height="2"  fill="#8751D8"/>
  <rect x="22" y="14" width="1"  height="1"  fill="#BE91FF"/>
  <rect x="20" y="16" width="1"  height="1"  fill="#BE91FF"/>
  <rect x="22" y="16" width="1"  height="1"  fill="#E8DDF7"/>
  <rect x="24" y="16" width="1"  height="1"  fill="#E8DDF7"/>
  <!-- Center select/start buttons -->
  <rect x="13" y="15" width="2"  height="1"  fill="#6940A7"/>
  <rect x="17" y="15" width="2"  height="1"  fill="#6940A7"/>
  <!-- Center logo area -->
  <rect x="14" y="12" width="4"  height="3"  fill="#0B0712"/>
  <rect x="15" y="13" width="2"  height="1"  fill="#9B64F6"/>
</svg>
