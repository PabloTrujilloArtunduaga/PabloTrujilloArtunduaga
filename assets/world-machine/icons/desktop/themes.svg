<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32" shape-rendering="crispEdges">
  <!-- WME-inspired themes / palette drop icon -->
  <!-- Bucket body -->
  <rect x="10" y="10" width="14" height="12" fill="#1A1028"/>
  <rect x="10" y="10" width="14" height="1"  fill="#9B64F6"/>
  <rect x="10" y="10" width="1"  height="12" fill="#9B64F6"/>
  <rect x="23" y="10" width="1"  height="12" fill="#9B64F6"/>
  <rect x="10" y="21" width="14" height="1"  fill="#9B64F6"/>
  <!-- Bucket handle -->
  <rect x="13" y="7"  width="8"  height="1"  fill="#9B64F6"/>
  <rect x="12" y="8"  width="1"  height="2"  fill="#9B64F6"/>
  <rect x="21" y="8"  width="1"  height="2"  fill="#9B64F6"/>
  <!-- Pouring drop -->
  <rect x="24" y="8"  width="2"  height="4"  fill="#8751D8"/>
  <rect x="23" y="11" width="1"  height="1"  fill="#8751D8"/>
  <rect x="25" y="12" width="1"  height="1"  fill="#8751D8"/>
  <rect x="24" y="13" width="1"  height="2"  fill="#6940A7"/>
  <!-- Color puddle interior -->
  <rect x="12" y="14" width="10" height="6"  fill="#8751D8"/>
  <rect x="13" y="15" width="4"  height="2"  fill="#BE91FF"/>
  <!-- Splash drop bottom -->
  <rect x="13" y="22" width="8"  height="1"  fill="#6940A7"/>
  <rect x="11" y="23" width="12" height="1"  fill="#6940A7"/>
  <rect x="10" y="24" width="14" height="1"  fill="#2A1A3E"/>
  <!-- Color swatch row on bucket -->
  <rect x="12" y="12" width="3"  height="1"  fill="#BE91FF"/>
  <rect x="16" y="12" width="3"  height="1"  fill="#E8DDF7"/>
  <rect x="20" y="12" width="2"  height="1"  fill="#9B64F6"/>
</svg>
